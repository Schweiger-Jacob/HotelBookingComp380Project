<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Partner Account</title>
    <link rel="stylesheet" href="styles2.css">
</head>
<body>
    <!-- Header -->
    <div class="frame">
        <div class="Rectangle1"></div>
        <div class="HotelBookingHeading"><span>Hotel</span><span>Booking</span></div></div>
    </div>

    <!-- Main Content -->
    <div class="Rectangle1 content-banner"></div>
    <div class="MainHeadingFormat">Create Your Partner Account</div>

    <!-- Owner Information Section -->
    <div class="OwnerInformation">Owner Information</div>
    <div class="Line1"></div>
    
    <div class="form-row">
        <label class="FirstName">First Name:-</label>
        <input type="text" class="Rectangle3">
    </div>
    
    <div class="form-row">
        <label class="LastName">Last Name:-</label>
        <input type="text" class="Rectangle4">
    </div>
    
    <div class="form-row">
        <label class="PhoneNumber">Phone Number:-</label>
        <input type="tel" class="Rectangle5">
    </div>
    
    <div class="form-row">
        <label class="EmailAddress">Email Address:-</label>
        <input type="email" class="Rectangle6">
    </div>
    
    <div class="form-row">
        <label class="CreateYourPassword">Create Your Password:-</label>
        <input type="password" class="Rectangle7">
    </div>
    
    <div class="form-row">
        <label class="ConfirmYourPassword">Confirm Your Password:-</label>
        <input type="password" class="Rectangle8">
    </div>

    <!-- Hotel Information Section -->
    <div class="HotelInformation">Hotel Information</div>
    <div class="Line2"></div>
    
    <div class="form-row">
        <label class="Name">Name:-</label>
        <input type="text" class="Rectangle3 hotel-name">
    </div>
    
    <div class="form-row">
        <label class="Type">Type:-</label>
        <input type="text" class="Rectangle4 hotel-type">
    </div>
    
    <div class="form-row">
        <label class="PhoneNumberHotel">Phone Number:-</label>
        <input type="tel" class="Rectangle5 hotel-phone">
    </div>
    
    <div class="form-row">
        <label class="EmailAddressHotel">Email Address:-</label>
        <input type="email" class="Rectangle6 hotel-email">
    </div>
    
    <div class="form-row">
        <label class="FullAddressWithAreaCode">Full Address(With Area code):-</label>
        <input type="text" class="Rectangle7 hotel-address">
    </div>
    
    <div class="form-row">
        <label class="TotalRooms">Total Rooms:-</label>
        <input type="number" class="Rectangle8 hotel-rooms">
    </div>
    
    <div class="Frame3">
        <button class="Rectangle9">
            <div class="ButtomFormat">Create Account</div>
        </button>
    </div>

    <!-- Footer -->
    <div>
        <div class="LowerRectangle"></div>
        <div class="ContactUs">Contact Us</div>
    </div>
</body>
</html>
