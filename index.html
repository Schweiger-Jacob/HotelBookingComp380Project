<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hotel Booking</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="navbar">
    <div class="logo">HotelBooking</div>
    <nav>
      <a href="index.html">Home</a>
      <a href="hotels.html">Hotels</a>
      <a href="experiences.html">Experiences</a>
      <a href="about.html">About</a>
    </nav>
    <button id="profile-button">Login</button>
  </header>
  <div id="result" style="white-space: pre; font-family: monospace;"></div>

  <section class="hero">
    <div class="hero-text">
      <h1>Hotel Booking</h1>
      <p>Find your perfect getaway at the finest hotels.</p>
    </div>
    
    
    
  </section>
  <section class="search-bar">
    <form id="search-form">
      <input type="text" placeholder="Destination" required>
      <input type="date" required>
      <input type="date" required>
      <input type="number" placeholder="Guests" min="1" required>
      <button type="submit">Search</button>
    </form>
  </section>
  
  <main>
    <section class="hotel-list" id="hotel-list">
      <!-- Hotels will be loaded here -->
    </section>
  </main>

  

  <script>
    const profileButton = document.getElementById('profile-button');

    function checkLogin() {
      const user = localStorage.getItem('user');
      if (user) {
        profileButton.textContent = `Welcome, ${user.split('@')[0]}`;
        profileButton.addEventListener('click', function() {
          localStorage.removeItem('user');
          window.location.href = "login.html";
        });
      } else {
        profileButton.textContent = "Login";
        profileButton.addEventListener('click', function() {
          window.location.href = "login.html";
        });
      }
    }

    checkLogin();
  </script>
  
  <script src="script.js"></script>

</body>
</html>
