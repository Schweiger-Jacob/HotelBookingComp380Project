<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>
    <link rel="stylesheet" href="Adminstyles.css">
</head>
<body>
    <div class="frame">
        <div class="Rectangle1"></div>
        <div class="HotelBookingHeading">
            <span>Hotel</span><span>Booking</span>
        </div>
    </div>

    <!-- Header with Forgot Password -->
    <div class="Rectangle1 content-banner"></div>
    <div class="MainHeadingFormat">Forgot Password</div>

    <!-- Email and Verification Section -->
    <div class="Frame102">
        <div class="EnterEmailId">Enter Email Id:-</div>
        <input type="email" id="email" class="Rectangle102" placeholder="Enter your email">
    </div>

    <!-- Password Change Section -->
    <div class="Frame103">
        <div class="EnterNewPassword">Enter New Password:-</div>
        <input type="password" id="newPassword" class="Rectangle104" placeholder="New Password">

        <div class="ConfirmNewPassword">Confirm New Password:-</div>
        <input type="password" id="confirmPassword" class="Rectangle105" placeholder="Confirm New Password">

        <button class="Rectangle108" onclick="changePassword()">
            <div class="ButtomFormat">Change Password</div>
        </button>
    </div>

    <!-- Footer -->
    <div>
        <div class="LowerRectangle"></div>
        <div class="ContactUs">Contact Us</div>
    </div>

    <script>
        function changePassword() {
            const email = document.getElementById('email').value;
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (!email || !newPassword || !confirmPassword) {
                alert('Please fill in all the fields.');
                return;
            }

            if (newPassword !== confirmPassword) {
                alert('Passwords do not match.');
                return;
            }

            alert('Password successfully changed! Redirecting to login page...');
            window.location.href = 'LoginPage.html'; // Redirect to login page
        }
    </script>
</body>
</html>
