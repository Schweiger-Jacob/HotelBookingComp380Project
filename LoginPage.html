<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="globals.css" />
    <link rel="stylesheet" href="loginpagestyle.css" />
    <title>Login Page</title>
    
  </head>
  <body>
    <div class="LoginBody">
      <div class="frame">
        <div class="HotelBookingHeading"><span>Hotel</span><span>Booking</span></div>
      </div>
      <div class="overlap-group-wrapper">
        <div class="overlap-group">
          <div class="rectangle"></div>
          <p class="div">Sign In to your Account</p>

          <!-- Updated inputs with IDs -->
          <input id="email" class="LoginEmailID" type="text" placeholder="Email ID" />
          <hr class="line" />
          <input id="password" class="LoginPassword" type="password" placeholder="Password" />
          <hr class="line2" />

          <!-- Changed Login button to trigger JS -->
          <div class="LoginButtonRectangle"></div>
          <div class="LoginButton" onclick="handleLogin()">Login</div>
        </div>
      </div>
      <div class="lower-rectangle">
        <a href="Forgot.html" class="ForgetPassword01">Forgot Password</a>
        <a href="CreateAccount.html" class="CreateAccount01">Create Partner Account</a>
        <div class="ContactUs01">Contact Us</div>
      </div>
    </div>
  </body>
</html>
