<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hotel Booking</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="navbar">
    <div class="logo">HotelBooking</div>
    <nav>
      <a href="index.html">Home</a>
      <a href="hotels.html">Hotels</a>
      <a href="experiences.html">Experiences</a>
      <a href="about.html">About</a>
    </nav>
    <button id="profile-button">Login</button>
  </header>
  <div id="result" style="white-space: pre; font-family: monospace;"></div>

  <section class="hero">
    <div class="hero-text">
      <h1>Hotel Booking</h1>
      <p>Find your perfect getaway at the finest hotels.</p>
    </div>
    
    
    
  </section>
  <section class="search-bar">
    <form id="search-form">
      <input type="text" id="search-destination" placeholder="Enter city or hotel name" />

      <select id="search-location">
        <option value="">Select Location</option>
        <option value="miami">Miami</option>
        <option value="denver">Denver</option>
        <option value="los angeles">Los Angeles</option>
      </select>

      <select id="search-price">
        <option value="">Price Range</option>
        <option value="under300">Under $300</option>
        <option value="300to500">$300–$500</option>
        <option value="above500">Above $500</option>
      </select>

      <button id="search-button">Search</button>


    </form>
  </section>
  
  <main>
    <section class="hotel-list" id="hotel-list">
      <!-- hotels will be loaded here -->
    </section>
  </main>

  

  <script>
    const profileButton = document.getElementById('profile-button');

    function checkLogin() {
      const user = localStorage.getItem('user');
      if (user) {
        profileButton.textContent = `Welcome, ${user.split('@')[0]}`;
        profileButton.addEventListener('click', function() {
          localStorage.removeItem('user');
          window.location.href = "LoginPage.html";
        });
      } else {
        profileButton.textContent = "Login";
        profileButton.addEventListener('click', function() {
          window.location.href = "LoginPage.html";
        });
      }
    }

    checkLogin();
  </script>
  
  <script src="script.js"></script>
  
  <div id="hotel-cards" class="hotel-list"></div>

</body>
</html>
